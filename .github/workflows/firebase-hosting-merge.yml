# Line 1: Automated Sync of Entire WOTH2 Data Directory to Firebase RTDB
name: Sync WOTH2 Ecosystem to Firebase RTDB

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'scripts/**'

jobs:
  sync_rtdb:
    runs-on: ubuntu-latest
    steps:
      # Line 15: Checkout the full repository tree
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Line 19: Set up Node.js for seeding
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Line 25: Pass the secrets into process.env for seed-rtdb.js
      - name: Run RTDB Seed Script
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_AUTH_SECRET: ${{ secrets.FIREBASE_AUTH_SECRET }}
        run: |
          node scripts/seed-rtdb.js
