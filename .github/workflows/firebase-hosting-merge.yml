name: Sync Game Data to Firebase RTDB

on:
  push:
    paths:
      - 'game_data.json'
    branches:
      - main

jobs:
  sync_to_firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Push JSON to Firebase Realtime Database
        run: |
          curl -X PUT \
            "${{ secrets.FIREBASE_DATABASE_URL }}/game_data.json?auth=${{ secrets.FIREBASE_AUTH_SECRET }}" \
            -H "Content-Type: application/json" \
            -d @game_data.json
